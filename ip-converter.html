<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIDR to Symantec Format Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 720px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.875rem;
      color: #111827;
      resize: vertical;
      transition: border-color 0.15s;
      outline: none;
    }

    textarea:focus { border-color: #4f46e5; }

    textarea::placeholder { color: #9ca3af; }

    .input-area { margin-bottom: 16px; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 22px;
      border-radius: 7px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }

    .btn-primary:hover { background: #4338ca; }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1.5px solid #d1d5db;
    }

    .btn-secondary:hover { background: #e5e7eb; }

    .btn-copy {
      background: #10b981;
      color: #fff;
      margin-left: auto;
    }

    .btn-copy:hover { background: #059669; }

    .btn-copy.copied { background: #6b7280; }

    .output-header {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .output-header label { margin-bottom: 0; flex: 1; }

    .error {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #b91c1c;
      margin-bottom: 16px;
      display: none;
    }

    .stats {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 8px;
    }

    .stats span { font-weight: 600; color: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CIDR → Symantec Format Converter</h1>
    <p class="subtitle">Paste your IP list in CIDR notation, get it ready for Symantec entry.</p>

    <div class="input-area">
      <label>Input — CIDR addresses</label>
      <textarea id="input" rows="5"
        placeholder="10.128.21.0/25, 10.210.15.0/24, 192.168.1.0/26 ..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="convert()">Convert</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>

    <div class="error" id="error"></div>

    <div class="output-header">
      <label>Output — Symantec format</label>
      <button class="btn-copy" id="copyBtn" onclick="copyOutput()">Copy</button>
    </div>
    <textarea id="output" rows="10" readonly
      placeholder="Converted output will appear here..."></textarea>
    <div class="stats" id="stats"></div>
  </div>

  <script>
    function cidrToMask(prefix) {
      const n = parseInt(prefix, 10);
      if (isNaN(n) || n < 0 || n > 32) return null;
      const mask = n === 0 ? 0 : (0xFFFFFFFF << (32 - n)) >>> 0;
      return [
        (mask >>> 24) & 0xFF,
        (mask >>> 16) & 0xFF,
        (mask >>> 8) & 0xFF,
        mask & 0xFF
      ].join('.');
    }

    function isValidIP(ip) {
      const parts = ip.split('.');
      if (parts.length !== 4) return false;
      return parts.every(p => {
        const n = parseInt(p, 10);
        return !isNaN(n) && n >= 0 && n <= 255 && String(n) === p;
      });
    }

    function convert() {
      const raw = document.getElementById('input').value.trim();
      const errorEl = document.getElementById('error');
      const outputEl = document.getElementById('output');
      const statsEl = document.getElementById('stats');

      errorEl.style.display = 'none';
      outputEl.value = '';
      statsEl.textContent = '';

      if (!raw) {
        showError('Please paste your IP list above.');
        return;
      }

      // Split on commas, newlines, or semicolons
      const entries = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
      const lines = [];
      const errors = [];

      entries.forEach((entry, i) => {
        const parts = entry.split('/');
        if (parts.length !== 2) {
          errors.push(`Entry ${i + 1} "${entry}": missing prefix length (e.g. /24)`);
          return;
        }
        const ip = parts[0].trim();
        const prefix = parts[1].trim();

        if (!isValidIP(ip)) {
          errors.push(`Entry ${i + 1} "${entry}": invalid IP address`);
          return;
        }

        const mask = cidrToMask(prefix);
        if (!mask) {
          errors.push(`Entry ${i + 1} "${entry}": invalid prefix length`);
          return;
        }

        lines.push(ip, mask);
      });

      if (errors.length) {
        showError('Some entries were skipped:<br>' + errors.join('<br>'));
      }

      if (lines.length) {
        outputEl.value = lines.join('\n');
        const count = lines.length / 2;
        statsEl.innerHTML = `<span>${count}</span> entr${count === 1 ? 'y' : 'ies'} converted.`;
      }
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('stats').textContent = '';
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }

    function copyOutput() {
      const output = document.getElementById('output').value;
      if (!output) return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    // Allow Enter key to trigger convert from input
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'Enter') convert();
    });
  </script>
</body>
</html>
