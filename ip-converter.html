<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIDR to Symantec Format Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 720px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.875rem;
      color: #111827;
      resize: vertical;
      transition: border-color 0.15s;
      outline: none;
    }

    textarea:focus { border-color: #4f46e5; }

    textarea::placeholder { color: #9ca3af; }

    .input-area { margin-bottom: 16px; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 22px;
      border-radius: 7px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }

    .btn-primary:hover { background: #4338ca; }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1.5px solid #d1d5db;
    }

    .btn-secondary:hover { background: #e5e7eb; }

    .btn-copy {
      background: #10b981;
      color: #fff;
      margin-left: auto;
    }

    .btn-copy:hover { background: #059669; }

    .btn-copy.copied { background: #6b7280; }

    .output-header {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .output-header label { margin-bottom: 0; flex: 1; }

    .error {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #b91c1c;
      margin-bottom: 16px;
      display: none;
    }

    .stats {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 8px;
    }

    .stats span { font-weight: 600; color: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CIDR → Symantec Format Converter</h1>
    <p class="subtitle">Paste your IP list in CIDR notation, get it ready for Symantec entry.</p>

    <div class="input-area">
      <label>Input — CIDR addresses</label>
      <textarea id="input" rows="5"
        placeholder="10.128.21.0/25, 10.210.15.0/24, 192.168.1.0/26 ..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="convertBtn">Convert</button>
      <button class="btn-secondary" id="clearBtn">Clear</button>
    </div>

    <div class="error" id="error"></div>

    <div class="output-header">
      <label>Output — Symantec format</label>
      <button class="btn-copy" id="copyBtn">Copy</button>
    </div>
    <textarea id="output" rows="10" readonly
      placeholder="Converted output will appear here..."></textarea>
    <div class="stats" id="stats"></div>
  </div>

  <script>
    function cidrToMask(prefix) {
      var n = parseInt(prefix, 10);
      if (isNaN(n) || n < 0 || n > 32) return null;
      var mask = n === 0 ? 0 : ((0xFFFFFFFF << (32 - n)) >>> 0);
      return [
        (mask >>> 24) & 0xFF,
        (mask >>> 16) & 0xFF,
        (mask >>> 8)  & 0xFF,
        mask & 0xFF
      ].join('.');
    }

    function isValidIP(ip) {
      var parts = ip.split('.');
      if (parts.length !== 4) return false;
      for (var i = 0; i < parts.length; i++) {
        var n = parseInt(parts[i], 10);
        if (isNaN(n) || n < 0 || n > 255 || String(n) !== parts[i]) return false;
      }
      return true;
    }

    function runConvert() {
      var raw      = document.getElementById('input').value.trim();
      var errorEl  = document.getElementById('error');
      var outputEl = document.getElementById('output');
      var statsEl  = document.getElementById('stats');

      errorEl.style.display = 'none';
      outputEl.value = '';
      statsEl.textContent = '';

      if (!raw) {
        showError('Please paste your IP list above.');
        return;
      }

      var entries = raw.split(/[\n,;]+/);
      var lines = [];
      var errors = [];

      for (var i = 0; i < entries.length; i++) {
        var entry = entries[i].trim();
        if (!entry) continue;

        var slash = entry.indexOf('/');
        if (slash === -1) {
          errors.push('Entry ' + (i + 1) + ' "' + entry + '": missing prefix length (e.g. /24)');
          continue;
        }

        var ip     = entry.substring(0, slash).trim();
        var prefix = entry.substring(slash + 1).trim();

        if (!isValidIP(ip)) {
          errors.push('Entry ' + (i + 1) + ' "' + entry + '": invalid IP address');
          continue;
        }

        var mask = cidrToMask(prefix);
        if (!mask) {
          errors.push('Entry ' + (i + 1) + ' "' + entry + '": invalid prefix length');
          continue;
        }

        lines.push(ip);
        lines.push(mask);
      }

      if (errors.length) {
        showError('Some entries were skipped:<br>' + errors.join('<br>'));
      }

      if (lines.length) {
        outputEl.value = lines.join('\n');
        var count = lines.length / 2;
        statsEl.innerHTML = '<span>' + count + '</span> entr' + (count === 1 ? 'y' : 'ies') + ' converted.';
      }
    }

    function clearForm() {
      document.getElementById('input').value   = '';
      document.getElementById('output').value  = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('stats').textContent   = '';
      var btn = document.getElementById('copyBtn');
      btn.textContent = 'Copy';
      btn.className = btn.className.replace(' copied', '');
    }

    function copyOutput() {
      var outputEl = document.getElementById('output');
      var text = outputEl.value;
      if (!text) return;

      var btn = document.getElementById('copyBtn');

      // Try modern clipboard API first, fall back to execCommand for Safari
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          flashCopied(btn);
        }).catch(function() {
          fallbackCopy(outputEl, btn);
        });
      } else {
        fallbackCopy(outputEl, btn);
      }
    }

    function fallbackCopy(el, btn) {
      el.select();
      el.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        flashCopied(btn);
      } catch (e) {
        alert('Copy failed — please select the output text and copy manually (Cmd+C).');
      }
    }

    function flashCopied(btn) {
      btn.textContent = 'Copied!';
      btn.className += ' copied';
      setTimeout(function() {
        btn.textContent = 'Copy';
        btn.className = btn.className.replace(' copied', '');
      }, 2000);
    }

    function showError(msg) {
      var el = document.getElementById('error');
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('convertBtn').addEventListener('click', runConvert);
      document.getElementById('clearBtn').addEventListener('click', clearForm);
      document.getElementById('copyBtn').addEventListener('click', copyOutput);
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') runConvert();
      });
    });
  </script>
</body>
</html>
