<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIDR to Symantec Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 720px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: #6b7280; margin-bottom: 24px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.875rem;
      color: #111827;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #4f46e5; }
    .input-area { margin-bottom: 16px; }
    .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
    button {
      padding: 10px 22px;
      border-radius: 7px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1.5px solid #d1d5db; }
    .btn-copy { background: #10b981; color: #fff; margin-left: auto; }
    .output-header { display: flex; align-items: center; margin-bottom: 6px; }
    .output-header label { margin-bottom: 0; flex: 1; }
    .error {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #b91c1c;
      margin-bottom: 16px;
      display: none;
    }
    .stats { font-size: 0.78rem; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CIDR to Symantec Format Converter</h1>
    <p class="subtitle">Paste your IP list in CIDR notation, get it ready for Symantec entry.</p>

    <div class="input-area">
      <label>Input - CIDR addresses</label>
      <textarea id="inputBox" rows="5" placeholder="10.128.21.0/25, 10.210.15.0/24, 192.168.1.0/26 ..."></textarea>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-primary" onclick="runConvert()">Convert</button>
      <button type="button" class="btn-secondary" onclick="clearForm()">Clear</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="output-header">
      <label>Output - Symantec format</label>
      <button type="button" class="btn-copy" onclick="copyOutput()">Copy</button>
    </div>
    <textarea id="outputBox" rows="10" readonly placeholder="Converted output will appear here..."></textarea>
    <div class="stats" id="statsBox"></div>
  </div>

<script type="text/javascript">
function cidrToMask(bits) {
  var n = parseInt(bits, 10);
  if (isNaN(n) || n < 0 || n > 32) { return null; }
  if (n === 0) { return "0.0.0.0"; }
  var mask = (0xFFFFFFFF << (32 - n)) >>> 0;
  var a = (mask >>> 24) & 255;
  var b = (mask >>> 16) & 255;
  var c = (mask >>> 8)  & 255;
  var d =  mask         & 255;
  return a + "." + b + "." + c + "." + d;
}

function runConvert() {
  try {
    var inputEl  = document.getElementById("inputBox");
    var outputEl = document.getElementById("outputBox");
    var errorEl  = document.getElementById("errorBox");
    var statsEl  = document.getElementById("statsBox");

    errorEl.style.display = "none";
    errorEl.innerHTML = "";
    outputEl.value = "";
    statsEl.textContent = "";

    var raw = inputEl.value.trim();
    if (raw === "") {
      errorEl.innerHTML = "Please paste your IP list above.";
      errorEl.style.display = "block";
      return;
    }

    var tokens = raw.split(/[\s,;]+/);
    var result = [];
    var count  = 0;

    for (var i = 0; i < tokens.length; i++) {
      var token = tokens[i].trim();
      if (token === "") { continue; }

      var slashPos = token.indexOf("/");
      if (slashPos < 0) {
        continue;
      }

      var ip     = token.substring(0, slashPos);
      var prefix = token.substring(slashPos + 1);
      var mask   = cidrToMask(prefix);

      if (mask === null) { continue; }

      result.push(ip);
      result.push(mask);
      count++;
    }

    if (result.length === 0) {
      errorEl.innerHTML = "No valid CIDR entries found. Make sure format is like: 10.0.0.0/24";
      errorEl.style.display = "block";
      return;
    }

    outputEl.value = result.join("\n");
    statsEl.textContent = count + " entr" + (count === 1 ? "y" : "ies") + " converted.";

  } catch (err) {
    alert("Error: " + err.message);
  }
}

function clearForm() {
  document.getElementById("inputBox").value  = "";
  document.getElementById("outputBox").value = "";
  document.getElementById("errorBox").style.display = "none";
  document.getElementById("statsBox").textContent   = "";
}

function copyOutput() {
  var el = document.getElementById("outputBox");
  if (!el.value) { return; }
  el.select();
  el.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Copied to clipboard!");
}
</script>
</body>
</html>
